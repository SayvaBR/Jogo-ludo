name: React Ludo / Android APK
on:
  push:
    branches: [main, feat/react-mobile-ludo]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify game rules
        run: npm test
      - name: Type check and build web app
        run: npm run build
      - name: Generate Android project
        run: npx cap add android && npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ludo-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish directly downloadable Android APK (V3)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view v0.3.0-test >/dev/null 2>&1; then
            echo 'V3 test release already published; not overwriting the existing APK.'
            exit 0
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk Ludo-v3.apk
          gh release create v0.3.0-test Ludo-v3.apk \
            --target "$GITHUB_SHA" \
            --title 'Ludo V3 - Android de teste' \
            --notes 'APK Android de teste: dado com seis faces equiprováveis e entradas/corredores corrigidos. Instale por sua conta; ainda não é versão de publicação na Play Store.' \
            --prerelease
